[workspace]
members = [
    "crates/hazardflow-proto",
    "crates/common",
    "crates/ingestion-service",
    "crates/inference-worker",
    "crates/safety-twin-service",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HazardFlow AI Core Systems Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full", "tracing"] }
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdkafka = { version = "0.36", features = ["tokio"] }
redis = { version = "0.25", features = ["tokio-comp", "aio", "connection-manager"] }
mongodb = { version = "2.8", features = ["tokio-runtime"] }
onnxruntime = { version = "0.0.14" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
